<svg xmlns="http://www.w3.org/2000/svg" width="840" height="330" viewBox="0 0 840 330" role="img" aria-label="Journey graph: freelance services in 2017, then catalog specialist, consulting, automation tools, and now software and SaaS.">
<defs><linearGradient id="rg" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#10B981"/><stop offset="0.5" stop-color="#0EA5E9"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient><linearGradient id="ar" x1="0" x2="1"><stop offset="0" stop-color="#10B981" stop-opacity="0.28"/><stop offset="0.5" stop-color="#0EA5E9" stop-opacity="0.24"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0.30"/></linearGradient>
<linearGradient id="fd" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.92"/></linearGradient></defs>
<style>
.l{stroke-dasharray:1000;stroke-dashoffset:0;animation:draw 2.6s ease-out .2s backwards}@keyframes draw{from{stroke-dashoffset:1000}}
.ar{animation:in 1.4s ease-out 1.4s backwards}.n{animation:in .6s ease-out backwards}@keyframes in{from{opacity:0}}
.p{opacity:0;transform-box:fill-box;transform-origin:center;animation:ring 2.2s ease-out 3s infinite}@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(3);opacity:0}}
@media (prefers-reduced-motion:reduce){.l,.ar,.n,.p{animation:none}}
</style>
